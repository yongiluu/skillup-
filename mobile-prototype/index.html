<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillUp - Vista Doble</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }
        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 50px;
            align-items: flex-start;
        }
        .prototype-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .prototype-wrapper h2 {
            color: #476a7b;
            font-size: 20px;
        }
        iframe {
            width: 430px;
            height: 900px;
            border: none;
            border-radius: 40px;
            background-color: #f0f4f8;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Prototipo Trabajador -->
        <div class="prototype-wrapper">
            <iframe src="app.html?role=worker" title="Trabajador"></iframe>
        </div>

        <!-- Prototipo Gerente -->
        <div class="prototype-wrapper">
            <iframe src="app.html?role=manager" title="Gerente"></iframe>
        </div>
    </div>
</body>
</html>
